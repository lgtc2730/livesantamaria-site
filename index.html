<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live Santa Maria | Lançamento em breve</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:#fff;

    background:
        linear-gradient(rgba(0,0,0,.68),rgba(0,0,0,.68)),
        url("assets/launch-background.jpg") center center / cover no-repeat fixed;
}

.container{
    max-width:900px;
    padding:40px;
}

h1{
    font-size:clamp(4rem,8vw,6rem);
    font-weight:700;
    letter-spacing:3px;
}

.subtitle{
    margin-top:18px;
    font-size:clamp(1.6rem,3vw,2.2rem);
    font-weight:300;
    opacity:.95;
}

.separator{
    width:90px;
    height:2px;
    background:rgba(255,255,255,.8);
    margin:36px auto;
}

.message{
    font-size:clamp(1.15rem,2vw,1.45rem);
    line-height:1.8;
    opacity:.92;
}

.date{
    margin-top:42px;
    font-size:clamp(1.8rem,3vw,2.4rem);
    font-weight:600;
}

.footer{
    margin-top:55px;
    font-size:1.45rem;
    font-style:italic;
    opacity:.95;
}

.thanks{
    margin-top:18px;
    font-size:1.15rem;
    opacity:.80;
}
</style>

</head>

<body>

<div class="container">

    <h1>LIVE SANTA MARIA</h1>

    <div class="subtitle">
        Uma Janela para Santa Maria
    </div>

    <div class="separator"></div>

    <div class="message">
        Estamos nos últimos preparativos para o lançamento oficial do projeto.
    </div>

    <div class="date">
        15 de julho de 2026
    </div>

    <div class="footer">
        Voltamos muito em breve.
    </div>

    <div class="thanks">
        Obrigado pela sua visita.
    </div>

</div>

</body>
</html>
